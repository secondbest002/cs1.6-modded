// ----------------------------------------------------------------------------
// convar_whitelist.Cfg - Whitelist configuration file
// ----------------------------------------------------------------------------
//
// Description:
//    This configuration file allows user to specify console variables (Convars)
//    and commands to be added to the whitelist. The whitelist allows the server
//    operator to execute these specified ConVars and client commands.
//
// Usage:
//    To add a Convar or Command to the whitelist, simply insert it into this file.
//    each entry should be on a new line and follow the format:
//    "<convar_or_command>"
//    also you can feel free to use comments
//
// Note:
//    Modifying this config file without a proper understanding may lead to unexpected
//    changes in your configuration. Ensure that only trusted Convars and commands are
//    added to the whitelist to maintain the desired gaming experience. Be cautious,
//    as the server operator can alter your client's configuration, potentially leading
//    to undesirable consequences for you.
