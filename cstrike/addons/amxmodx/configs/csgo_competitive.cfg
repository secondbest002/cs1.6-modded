// ========================================================================
// CS:GO COMPETITIVE MATCH MOD CONFIGURATION
// ========================================================================
// File ini dieksekusi otomatis oleh plugin csgo_competitive.amxx

// Aktifkan / Nonaktifkan Mod Kompetitif
// 0 = Disabled, 1 = Enabled
amx_csgo_mode 1

// Format Match (Ronde per Half)
// 12 = Format MR12 (CS2 / CS:GO Baru: Max 24 ronde, menang di 13 ronde)
// 15 = Format MR15 (CS:GO Klasik / Turnamen 1.6: Max 30 ronde, menang di 16 ronde)
amx_csgo_maxrounds 24

// Ronde Pisau (Knife Round) sebelum Match Live
// 1 = Ada knife round untuk menentukan pilihan side (CT atau T)
// 0 = Langsung masuk ke ronde match live
amx_csgo_kniferound 1

// Mode Pemanasan (Warmup Deathmatch)
// 1 = Pemain otomatis respawn dan uang $16,000 sampai semua .ready
// 0 = Langsung match tanpa warmup
amx_csgo_warmup 1

// Durasi Batas Waktu Warmup Deathmatch (menit)
// Standar: 55 menit batas waktu
amx_csgo_warmuptime 55

// Tactical Timeout per Tim per Babak (Half)
// Jumlah kuota .timeout yang bisa dipanggil oleh masing-masing tim
amx_csgo_timeouts 1

// Durasi Tactical Timeout (detik)
// Standar CS:GO = 60 detik
amx_csgo_timeout_duration 60

// Uang Awal di Babak Overtime (OT)
// Standar CS:GO = $10,000 (atau $16,000)
amx_csgo_ot_money 10000

// Otomatisasi Bot YaPB
// 1 = Bot otomatis ikut .ready saat pemain manusia ketik .ready (Sangat ramah Solo Play)
// 0 = Bot tidak otomatis ready (Hanya untuk server manusia)
amx_csgo_bot_autoready 1

// Sistem Loss Bonus CS:GO (Tangga Bonus Kalah)
// 1 = Tangga bonus kalah ($1400 -> $1900 -> $2400 -> $2900 -> $3400) turun 1 level saat menang
// 0 = Sistem loss bonus klasik CS 1.6 (reset ke level 0 saat menang)
amx_csgo_lossbonus 1

// ------------------------------------------------------------------------
// Fitur Visual & Immersion CS:GO (HUD, DHUD & FX)
// ------------------------------------------------------------------------
// Gaya Tampilan HUD Match
// 1 = CS:GO Modern Tournament Top Header [CT Blue vs T Orange] & Status Indikator
// 0 = Klasik Sederhana
amx_csgo_hud_style 1

// Kartu MVP Tengah Layar (Director HUD / DHUD)
// 1 = Tampilkan kartu visual MVP prestige gold di tengah layar tiap akhir ronde
// 0 = Pengumuman chat biasa saja
amx_csgo_mvp_card 1

// Indikator Ticking C4 Timer di Header Atas
// 1 = Tampilkan countdown C4 real-time & blinking alert merah di bawah 10 detik
// 0 = Nonaktifkan timer C4 di HUD
amx_csgo_c4_timer 40

// Transisi Layar Sinematik (ScreenFade)
// 1 = Aktifkan efek transisi sinematik (Fade to Black saat Halftime, Tint saat Timeout & Victory)
// 0 = Nonaktifkan efek ScreenFade
amx_csgo_screenfade 1

// Kartu Laporan Damage Ronde (Combat Damage Summary)
// 1 = Tampilkan ringkasan damage HUD di layar tiap akhir ronde / ketik .dmg
// 0 = Tampilkan di chat & console saja
amx_csgo_dmg_card 1

// ------------------------------------------------------------------------
// Konfigurasi Server Kompetitif Standar CS:GO
// ------------------------------------------------------------------------
// Catatan: mp_roundtime dan mp_buytime diatur dinamis otomatis oleh plugin:
// - Saat Warmup DM: roundtime 55 menit, buytime tanpa batas (-1)
// - Saat Match Live: roundtime 1.92 menit, buytime 0.45 menit
mp_c4timer 40             // 40 detik C4 timer standar kompetitif
mp_freezetime 15           // Freeze time dinamis (0 saat warmup, 20 saat match live)
mp_startmoney 800         // Uang awal $800
mp_autoteambalance 0      // Matikan auto-balance bawaan engine agar tim tidak teracak
mp_limitteams 0           // Izinkan jumlah tim fleksibel
mp_friendlyfire 1         // Friendly fire aktif (kompetitif)
mp_tkpunish 0             // Jangan kick bot/player jika ada accidental damage

echo [CS:GO Competitive] Configuration executed successfully!
csgo_comp_max_rounds 24
mp_roundtime 1.92
mp_buytime 20
