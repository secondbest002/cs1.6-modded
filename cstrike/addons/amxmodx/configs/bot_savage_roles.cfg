// ==============================================================================
// CS 1.6 Bot Savage AI - Esports Competitive Configuration
// Version: 3.0.0
// Author: Antigravity
// ==============================================================================

// Master Switch (1 = Enabled, 0 = Disabled)
bot_savage_enable "1"

// ------------------------------------------------------------------------------
// 1. Competitive Role System
// ------------------------------------------------------------------------------
// Enables the 5-Role Competitive meta (Entry Fragger, AWPer, Support, Lurker, IGL)
// and automatic player role menu (/role, /roles).
bot_savage_roles "1"

// ------------------------------------------------------------------------------
// 2. Common Angle & Holding Angle Engine
// ------------------------------------------------------------------------------
// Enables disciplined head-height crosshair placement and stationary angle holding
// when defending bombsites (CT) or post-plant sites (T).
bot_savage_holding "1"

// ------------------------------------------------------------------------------
// 3. Tactical Strats & Team Radio Calls
// ------------------------------------------------------------------------------
// Enables IGL round-start strategy announcements (Rush, Default, Split, Eco),
// enemy contact callouts with radio sounds, utility calls, and bomb intel.
bot_savage_calls "1"

// ------------------------------------------------------------------------------
// 4. Interactive Weapon Drop System
// ------------------------------------------------------------------------------
// Allows players to request weapon drops from bots by typing 'drop', '/drop',
// or using radio ('Need backup' / 'Cover me'). Also enables automated round-start
// economy drops where rich bots drop rifles for broke Entry/AWPers.
bot_savage_dropguns "1"

// ------------------------------------------------------------------------------
// 5. Movement Engine
// ------------------------------------------------------------------------------
// 0 = Clean smooth competitive grounded movement (Recommended, 100% YaPB pathing accuracy).
// 1 = Occasional tactical jump-peeks across chokepoints.
bot_savage_bhop "0"

// ------------------------------------------------------------------------------
// 6. Combat & Gunplay Mechanics
// ------------------------------------------------------------------------------
// Instantly cancels inertia on attack for 100% first-bullet accuracy
bot_savage_counterstrafe "1"

// AD-AD combat jiggle strafe & micro crouch-taps during duels
bot_savage_jiggle "0"

// Perfect recoil compensation (spray pull-down control)
bot_savage_recoil "0"

// Zero-latency triggerbot when enemy aligns with crosshair
bot_savage_triggerbot "0"

// Surviving teammate immediately snaps to killer of fallen teammate
bot_savage_tradefrag "1"

// Instantly spins 180 degrees away from incoming flashbangs and ducks
bot_savage_antiflash "0"

// Shares spotted enemy coordinates across all bots on the team
bot_savage_hivemind "0"

// Periodic auditory footsteps scanner for predictive wallbangs
bot_savage_wallbang "0"

// Synchronized crouch peek + wide swing anti-AWP protocol
bot_savage_doublepeek "0"

// Taps defuse sound on planted C4 to bait enemies, then ambushes
bot_savage_fakedefuse "1"

// Pinpoint mid-air Scout apex shot and fast AWP zoom fire
bot_savage_jumpscout "0"

// Automatically retreats and ducks when magazine is empty in combat
bot_savage_reloadcover "1"

// ------------------------------------------------------------------------------
// 7. Knife Round Mid Brawl Protocol
// ------------------------------------------------------------------------------
// 1 = Bots sprint directly to Mid during Knife Round for an instant gladiator clash
// 0 = Default bot wandering
bot_savage_knife_midbrawl "1"

// ------------------------------------------------------------------------------
// 8. Ground Weapon Scavenge & Dead Body Upgrades
// ------------------------------------------------------------------------------
// 1 = Bots dynamically upgrade to superior rifles/AWP from dead bodies,
//     and actively save dropped high-tier weapons at the end of the round.
// 0 = Bots ignore ground weapons.
bot_savage_scavenge "1"

// ------------------------------------------------------------------------------
// 9. Freeze Time Role Priority Weapon Delivery
// ------------------------------------------------------------------------------
// 1 = Bots that saved high-tier weapons deliver them to priority roles in Freeze Time
//     (e.g., dropping saved AWP to the AWPer, dropping rifles to Entry/broke players).
// 0 = Disabled.
bot_savage_roledeliver "1"

// ------------------------------------------------------------------------------
// 10. Esports Player-to-Bot Tactical Chat Calls & Danger Engine (v3.4)
// ------------------------------------------------------------------------------
// Enables interactive player-to-bot chat communication and calls in team chat:
// - Danger Warnings: 'care a', 'care b', 'care short', 'care long', 'care mid', 'care awp', 'care flank'
// - Utility Assistance: 'flash me', 'popflash', 'smoke'
// - Objective Management: 'drop c4', 'drop bomb', 'rotate a', 'rotate b', 'save gun', 'cover defuse'
// - Combat Teamwork: 'trade me', 'watch back', 'watch flank'
// - Intel & Economy Queries: 'utility?', 'money?', 'status?', 'damage?'
// - Stealth & Pacing: 'walk', 'shift', 'hold', 'play slow'
bot_savage_chat_calls "1"

// Minimum cooldown in seconds between player chat tactical calls (prevents spam flooding)
bot_savage_chat_cooldown "1.5"

